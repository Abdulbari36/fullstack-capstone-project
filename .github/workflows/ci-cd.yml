name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (syntax check)
        run: node --check index.js && node --check app.js && node --check db.js

      - name: Smoke test — start server & hit endpoints
        run: |
          node index.js &
          SERVER_PID=$!
          sleep 20
          echo "--- GET / ---"
          curl -sSf http://localhost:8000/ | head -c 400; echo
          echo "--- GET /healthz ---"
          curl -sSf http://localhost:8000/healthz; echo
          echo "--- GET /api/gifts ---"
          curl -sSf http://localhost:8000/api/gifts | head -c 400; echo
          echo "--- GET /api/search?category=Books ---"
          curl -sSf "http://localhost:8000/api/search?category=Books" | head -c 400; echo
          echo "--- POST /api/auth/register ---"
          curl -sSf -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_user","email":"ci@example.com","password":"secret123"}' | head -c 400; echo
          kill $SERVER_PID

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t giftlink-backend ./backend

      - name: Build frontend image
        run: docker build -t giftlink-frontend ./frontend

  deploy:
    name: Deploy (Render)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: curl -sSf -X POST "$RENDER_DEPLOY_HOOK"
